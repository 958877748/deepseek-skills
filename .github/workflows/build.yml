name: Build Windows EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动触发运行

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install pkg (Node.js打包工具)
        run: npm install -g pkg

      - name: 打包为Windows EXE
        run: pkg package.json --targets node20-win-x64 --output mcpb.exe

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mcpb-windows-exe
          path: mcpb.exe
          retention-days: 7 # 保留7天
